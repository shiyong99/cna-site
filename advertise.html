<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advertise With Us — Quartz</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div id="site-drawer"></div>
  <div id="site-search"></div>
  <div id="site-auth"></div>

  <main>
    <section class="container">
      <div class="page-head">
        <h1>Advertise With Us</h1>
        <p class="dek">Reach a premium, engaged audience across news, video, podcasts and newsletters.</p>
      </div>

      <div class="grid-3" data-fetch="/api/ad-stats" data-render="stats"></div>

      <div class="section-row"><h2>Ad types</h2></div>
      <div class="ad-spec" data-fetch="/api/ad-specs" data-render="specs"></div>

      <div class="section-row"><h2>Get in touch</h2></div>
      <div class="grid-2" data-fetch="/api/contacts?group=advertise" data-render="contacts"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
